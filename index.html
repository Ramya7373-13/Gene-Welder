<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MutationMechanic | AI Protein Engineering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>
<script>
      // Note: importmap removed for Safari iOS < 16.4 compatibility
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#151e2e',
                950: '#020617',
              },
              primary: {
                DEFAULT: 'var(--color-primary)', 
                hover: 'var(--color-primary-hover)', 
              },
              secondary: {
                DEFAULT: 'var(--color-secondary)',
                hover: 'var(--color-secondary-hover)',
              },
              accent: {
                DEFAULT: 'var(--color-accent)',
                hover: 'var(--color-accent-hover)',
              },
              background: 'var(--color-background)',
              foreground: 'var(--color-foreground)',
              card: 'var(--color-card)',
              'card-foreground': 'var(--color-card-foreground)',
              muted: 'var(--color-muted)',
              'muted-foreground': 'var(--color-muted-foreground)',
              border: 'var(--color-border)',
              destructive: 'var(--color-destructive)',
              'on-destructive': 'var(--color-on-destructive)',
              ring: 'var(--color-ring)',
              scientific: {
                green: '#10b981',
                red: '#ef4444',
                blue: '#06b6d4',
              }
            },
            borderRadius: {
              lg: '0.5rem',
              xl: '0.75rem',
              '2xl': '1rem',
              '3xl': '1.5rem',
            },
            fontFamily: {
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out forwards',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-primary: #0891B2;
        --color-primary-hover: #0781A0;
        --color-secondary: #22D3EE;
        --color-secondary-hover: #1EC3DE;
        --color-accent: #059669;
        --color-accent-hover: #047857;
        --color-background: #ECFEFF;
        --color-foreground: #164E63;
        --color-card: #FFFFFF;
        --color-card-foreground: #164E63;
        --color-muted: #E8F1F6;
        --color-muted-foreground: #475569;
        --color-border: #A5F3FC;
        --color-destructive: #DC2626;
        --color-on-destructive: #FFFFFF;
        --color-ring: #0891B2;
      }
      body {
        background-color: var(--color-background);
        color: var(--color-foreground);
        font-family: 'Atkinson Hyperlegible', sans-serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-muted); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-muted-foreground); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-foreground); 
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
